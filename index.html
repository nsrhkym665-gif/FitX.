<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX GAMES - مكتبة الألعاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-blue: #0088ff;
            --text-main: #ffffff;
            --text-sub: #8c9ba5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 5%; background: rgba(21, 26, 35, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .logo span { color: var(--accent-blue); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        .section-title { font-size: 20px; margin-bottom: 20px; border-right: 4px solid var(--accent-blue); padding-right: 10px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s; border: 1px solid rgba(255,255,255,0.03);
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,136,255,0.15); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .card-cat { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }
        
        .btn-download {
            display: block; text-align: center; background: var(--accent-blue);
            color: #fff; text-decoration: none; padding: 8px 0; border-radius: 6px;
            font-weight: 700; transition: 0.2s;
        }
        .btn-download:hover { background: #0066cc; }
    </style>
</head>
<body>

    <header>
        <div class="logo">VORTEX <span>GAMES</span></div>
    </header>

    <div class="container">
        <h2 class="section-title">أحدث الألعاب المتاحة للتحميل</h2>
        <div class="grid">
            
            <!-- اللعبة الأولى -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e" alt="Cyberpunk 2077">
                <div class="card-body">
                    <div>
                        <div class="card-title">Cyberpunk 2077</div>
                        <div class="card-cat">Action / RPG</div>
                    </div>
                    <a href="https://archive.org/download/cyberpunk-2077-trailer-collection/Cyberpunk2077_Trailer.zip" target="_blank" class="btn-download">تحميل مباشر</a>
                </div>
            </div>

            <!-- اللعبة الثانية -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc" alt="God of War">
                <div class="card-body">
                    <div>
                        <div class="card-title">God of War</div>
                        <div class="card-cat">Action / Adventure</div>
                    </div>
                    <a href="https://archive.org/download/GodOfWarIIIArcade/GodOfWar.zip" target="_blank" class="btn-download">تحميل مباشر</a>
                </div>
            </div>

            <!-- اللعبة الثالثة -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420" alt="Spider-Man">
                <div class="card-body">
                    <div>
                        <div class="card-title">Spider-Man Remastered</div>
                        <div class="card-cat">Open World</div>
                    </div>
                    <a href="https://archive.org/download/spider-man-web-of-shadows_202103/Spider-Man.zip" target="_blank" class="btn-download">تحميل مباشر</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
