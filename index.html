<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX GAMES - مكتبة الألعاب المباشرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-blue: #0088ff;
            --text-main: #ffffff;
            --text-sub: #8c9ba5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 5%; background: rgba(21, 26, 35, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .logo span { color: var(--accent-blue); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        .section-title { font-size: 20px; margin-bottom: 20px; border-right: 4px solid var(--accent-blue); padding-right: 10px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s; border: 1px solid rgba(255,255,255,0.03);
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,136,255,0.15); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .card-cat { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }
        
        .btn-download {
            display: block; text-align: center; background: var(--accent-blue);
            color: #fff; text-decoration: none; padding: 8px 0; border-radius: 6px;
            font-weight: 700; transition: 0.2s;
        }
        .btn-download:hover { background: #0066cc; }

        #loading { text-align: center; padding: 50px; font-size: 18px; color: var(--text-sub); }
    </style>
</head>
<body>

    <header>
        <div class="logo">VORTEX <span>GAMES</span></div>
    </header>

    <div class="container">
        <h2 class="section-title">أحدث الألعاب المضافة</h2>
        <div id="loading">جاري تحميل الألعاب من الجدول...</div>
        <div class="grid" id="games-grid"></div>
    </div>

    <script>
        // ضع رابط الـ CSV الخاص بجدول جوجل هنا:
        const SHEET_CSV_URL = "استبدل_هذا_النص_برابط_الـ_CSV_بتاعك";

        async function loadGames() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                
                const rows = data.split('\n').slice(1); // تجاهل السطر الأول (العناوين)
                const grid = document.getElementById('games-grid');
                document.getElementById('loading').style.display = 'none';

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length >= 4) {
                        const title = cols[0].trim();
                        const category = cols[1].trim();
                        const image = cols[2].trim();
                        const download = cols[3].trim();

                        if (title && download) {
                            const cardHTML = `
                                <div class="card">
                                    <img src="${image || 'https://via.placeholder.com/300x400'}" alt="${title}">
                                    <div class="card-body">
                                        <div>
                                            <div class="card-title">${title}</div>
                                            <div class="card-cat">${category}</div>
                                        </div>
                                        <a href="${download}" target="_blank" class="btn-download">تحميل مباشر</a>
                                    </div>
                                </div>
                            `;
                            grid.innerHTML += cardHTML;
                        }
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerText = "حدث خطأ أثناء تحميل البيانات. تحقَّق من رابط الجدول.";
            }
        }

        loadGames();
    </script>
</body>
</html>
